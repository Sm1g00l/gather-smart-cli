[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gather-smart-cli"
version = "0.2.6"
description = "CLI para interagir com Smart Objects do Gather Town"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "click>=8.0",
    "requests>=2.28",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest", "responses"]

[project.scripts]
gather-setup = "gather_cli.setup:setup"
gather-bot = "gather_cli.bot:cli"
gather-light = "gather_cli.light:cli"
gather-inbox = "gather_cli.inbox:cli"
gather-test = "gather_cli.test_all:cli"

[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
markers = ["e2e: testes contra os Smart Objects reais do Gather (GATHER_E2E=1)"]
